<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel — Reklam Yönetimi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- Giriş ekranı (browser'da açılırsa) -->
    <div id="login-screen" class="login-screen" style="display:none;">
        <div class="login-box">
            <h1>🔐 Yönetici Girişi</h1>
            <input type="text" id="admin-username" placeholder="Kullanıcı adı" autocomplete="username" autocapitalize="none" value="admin555">
            <input type="password" id="admin-password" placeholder="Yönetici şifresi" autocomplete="current-password">
            <button onclick="doLogin()">Giriş Yap</button>
            <div id="login-error" class="error"></div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="admin-panel" style="display:none;">
        <header>
            <h1>⚙️ Admin Panel</h1>
            <button onclick="logout()" class="btn-ghost">Çıkış</button>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="dashboard">📊 Özet</button>
            <button class="tab" data-tab="users">👥 Kullanıcılar</button>
            <button class="tab" data-tab="ads">📢 Reklamlar</button>
            <button class="tab" data-tab="stats">📈 İstatistik</button>
        </nav>

        <main>
            <!-- DASHBOARD -->
            <section id="tab-dashboard" class="tab-content active">
                <h2>Genel Özet</h2>
                <div class="stats-grid" id="overview-stats">
                    <div class="stat-card"><div class="stat-num" id="ov-users">0</div><div class="stat-lbl">Kullanıcı</div></div>
                    <div class="stat-card"><div class="stat-num" id="ov-accounts">0</div><div class="stat-lbl">Hesap</div></div>
                    <div class="stat-card"><div class="stat-num" id="ov-active">0</div><div class="stat-lbl">Aktif</div></div>
                    <div class="stat-card"><div class="stat-num" id="ov-total">0</div><div class="stat-lbl">Toplam Gönderim</div></div>
                    <div class="stat-card green"><div class="stat-num" id="ov-success">0</div><div class="stat-lbl">Başarılı</div></div>
                    <div class="stat-card red"><div class="stat-num" id="ov-fail">0</div><div class="stat-lbl">Başarısız</div></div>
                </div>

                <div class="controls">
                    <button onclick="startAll()" class="btn-success">▶ Tümünü Başlat</button>
                    <button onclick="stopAll()" class="btn-danger">⏸ Tümünü Durdur</button>
                </div>
            </section>

            <!-- USERS -->
            <section id="tab-users" class="tab-content">
                <h2>Kullanıcılar ve Hesaplar</h2>
                <div id="users-list"></div>
            </section>

            <!-- ADS -->
            <section id="tab-ads" class="tab-content">
                <h2>Reklam Kütüphanesi</h2>
                <button onclick="showAdForm()" class="btn-primary">+ Yeni Reklam</button>
                <div id="ad-form" class="card" style="display:none;">
                    <h3 id="ad-form-title">Yeni Reklam</h3>
                    <input type="hidden" id="ad-id">
                    <select id="ad-type">
                        <option value="text">📝 Metin</option>
                        <option value="photo">🖼️ Foto</option>
                        <option value="video">🎬 Video</option>
                    </select>
                    <textarea id="ad-text" placeholder="Reklam metni (başlık/açıklama)"></textarea>
                    <input type="url" id="ad-media" placeholder="Medya URL (foto/video için)">
                    <div class="row">
                        <button onclick="saveAd()" class="btn-primary">Kaydet</button>
                        <button onclick="hideAdForm()" class="btn-ghost">İptal</button>
                    </div>
                </div>
                <div id="ads-list"></div>
            </section>

            <!-- STATS -->
            <section id="tab-stats" class="tab-content">
                <h2>Detaylı İstatistikler</h2>
                <div id="stats-container"></div>
            </section>
        </main>
    </div>

    <!-- Modal (hesap detayı) -->
    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
